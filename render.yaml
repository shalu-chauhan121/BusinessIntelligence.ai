services:
  - type: web
    name: businessintelligence-api
    runtime: python
    plan: free
    rootDir: backend

    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"

      - key: APP_ENV
        value: production

      - key: DB_BACKEND
        value: mongo

      - key: AUTH_MODE
        value: firebase

      - key: MONGODB_URI
        sync: false

      - key: MONGODB_DB
        value: businessintelligence

      - key: FIREBASE_PROJECT_ID
        sync: false

      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

      - key: CORS_ORIGINS
        value: https://placeholder.invalid